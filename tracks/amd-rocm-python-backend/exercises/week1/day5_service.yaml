# Day 5: 三种 Service 类型
# 用法：kubectl apply -f day5_service.yaml

---
# ClusterIP：集群内部访问
apiVersion: v1
kind: Service
metadata:
  name: fastapi-svc
  labels:
    app: fastapi
spec:
  type: ClusterIP
  selector:
    app: fastapi
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP

---
# NodePort：本地开发、集群外访问
apiVersion: v1
kind: Service
metadata:
  name: fastapi-nodeport
  labels:
    app: fastapi
spec:
  type: NodePort
  selector:
    app: fastapi
  ports:
  - name: http
    port: 80
    targetPort: 8000
    nodePort: 30080
    protocol: TCP

---
# Headless：无 ClusterIP，DNS 直接解析 Pod（StatefulSet 配合使用）
apiVersion: v1
kind: Service
metadata:
  name: fastapi-headless
  labels:
    app: fastapi
spec:
  type: ClusterIP
  clusterIP: None              # ← Headless
  selector:
    app: fastapi
  ports:
  - name: http
    port: 80
    targetPort: 8000