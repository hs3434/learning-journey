# Day 6: Secret（敏感配置）
# 用法：kubectl apply -f day6_secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  labels:
    app: config-demo
type: Opaque
data:
  # base64 编码后的值（用 echo -n "value" | base64 生成）
  # echo -n "demo" | base64     → ZGVtbw==
  username: ZGVtbw==
  # echo -n "demo123" | base64  → ZGVtbzEyMw==
  password: ZGVtbzEyMw==

---
# 另一种方式：用 stringData 写明文（K8s 自动 base64 编码）
# apiVersion: v1
# kind: Secret
# metadata:
#   name: db-secret-string
# type: Opaque
# stringData:
#   username: demo
#   password: demo123