apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: k8s-demo
  labels:
    app: k8s-local-stack
data:
  LOG_LEVEL: "info"
  APP_ENV: "production"
  APP_VERSION: "v1"
  MAX_WORKERS: "4"
  MODEL_NAME: "Qwen2.5-7B-Instruct"
  # 整段 YAML 配置（Volume 挂载到 /etc/config/app.yaml）
  app.yaml: |
    server:
      host: 0.0.0.0
      port: 8000
      workers: 4
    features:
      enable_metrics: true
      enable_tracing: false
    cache:
      ttl_seconds: 300