# ClusterIP（集群内部访问）
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-local-stack-svc
  namespace: k8s-demo
  labels:
    app: k8s-local-stack
spec:
  type: ClusterIP
  selector:
    app: k8s-local-stack
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP

---
# NodePort（本地开发、minikube 外部访问）
apiVersion: v1
kind: Service
metadata:
  name: k8s-local-stack-nodeport
  namespace: k8s-demo
  labels:
    app: k8s-local-stack
spec:
  type: NodePort
  selector:
    app: k8s-local-stack
  ports:
  - name: http
    port: 80
    targetPort: 8000
    nodePort: 30080
    protocol: TCP