name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'tracks/brain-computer-interface/exercises/**'
  pull_request:
    paths:
      - 'tracks/brain-computer-interface/exercises/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracks/brain-computer-interface/exercises

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run exercises
        run: |
          for week in week1 week2 week3 week4 week5 week6 week7; do
            echo "=== Testing $week ==="
            for f in exercises/$week/day*.py; do
              if [ -f "$f" ]; then
                echo "Checking: $f"
                python -c "import ast; ast.parse(open('$f').read())" || echo "Syntax error in $f"
              fi
            done
          done

      - name: Type check
        run: uv run pyright exercises/week*/day*.py 2>/dev/null || true

      - name: Coverage
        run: |
          if [ -f "tests/__init__.py" ]; then
            pytest tests/ -v --cov=exercises --cov-report=xml || true
          fi