[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bci"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "mne>=1.7",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "pyqt6>=6.0",
]

[project.scripts]
bci = "bci.main:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.sdist]
include = ["."]

[tool.pyright]
ignore = ["**/gui/**"]

[tool.pyright.venv]
pythonPath = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["__init__.py"]
python_functions = ["Test*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["bci"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "TYPE_CHECKING",
]