[project]
name = "bci-track"
version = "0.1.0"
description = "BCI software engineer learning track — signal processing, MNE-Python, BCI paradigms"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "mne>=1.7",
    "scikit-learn>=1.5",
    "pooch>=1.8",
    "ipython>=9.13.0",
    "pyqt6>=6.11.0",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.0",
    "jupyter>=1.0",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "scipy-stubs>=1.17.1.5",
    "types-pyyaml>=6.0.12.20260518",
]
