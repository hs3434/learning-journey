[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bci"
version = "0.1.0"
dynamic = ["dependencies"]

[project.scripts]
bci = "bci.main:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.sdist]
include = ["."]

[tool.pyright]
ignore = ["**/gui/**"]

[tool.pyright.venv]
pythonPath = ".venv"